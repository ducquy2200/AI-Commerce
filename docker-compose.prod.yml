version: '3.13'

services:
  api-gateway:
    image: ai-commerce-agent:latest
    ports:
      - "80:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_PERSIST_DIRECTORY=/chroma_db
      - DEBUG=false
    volumes:
      # Only mount persistent data
      - chroma_data:/chroma_db
    restart: always
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      CF_TUNNEL_ID: ${CF_TUNNEL_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CF_TUNNEL_CREDENTIALS_PATH:-./cloudflared/tunnel-credentials.json}:/etc/cloudflared/tunnel-credentials.json:ro
    command:
      - --no-autoupdate
      - tunnel
      - run
      - --credentials-file
      - /etc/cloudflared/tunnel-credentials.json
      - ${CF_TUNNEL_ID}
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  chroma_data:
    driver: local


