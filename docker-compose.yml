version: '3.13'

services:
  api-gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_PERSIST_DIRECTORY=/chroma_db
    volumes:
      - ./app:/app
      - ./chroma_db:/chroma_db
      - ./.env:/.env
    command: python run.py
    restart: unless-stopped
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      CF_TUNNEL_ID: ${CF_TUNNEL_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CF_TUNNEL_CREDENTIALS_PATH:-./cloudflared/tunnel-credentials.json}:/etc/cloudflared/tunnel-credentials.json:ro
    command:
      - --no-autoupdate
      - tunnel
      - run
      - --credentials-file
      - /etc/cloudflared/tunnel-credentials.json
      - ${CF_TUNNEL_ID}
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  chroma_db:
    driver: local


